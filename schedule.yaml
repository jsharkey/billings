  - {id: punch_clean,       name: Punch list & clean,           section: Closeout, crew: owner, effort: 3, after: [pant_touchup, insp_final, glas_showers, clos_main, clos_bsmt]}
  - {id: mile_movein,       name: Move-in,                      section: Closeout, milestone: true, after: [punch_clean]}

