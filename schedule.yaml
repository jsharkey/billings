    crew: elec
    template: elec_trim
    areas: [house, main_kitchen, main_dining, main_living, main_foyer, main_laundry, main_pantry, main_mud, main_hall_bath, main_ens_bath, main_bed1, main_bed2,
            bsmt_office, bsmt_play, bsmt_storage, bsmt_game, bsmt_family, bsmt_kitchenette, bsmt_mech, bsmt_hall_bath, bsmt_ens_bath, bsmt_bed1, bsmt_bed2]
    after: [pant_main, pant_bsmt]
  - id: hvac_trim
    name: HVAC trim
    section: Trim-out
    crew: owner
    template: hvac_trim
    areas: [main_kitchen, main_dining, main_living, main_foyer, main_laundry, main_mud, main_hall_bath, main_ens_bath, main_bed1, main_bed2,
